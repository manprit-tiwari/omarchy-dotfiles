# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # Reduce top gap by 6px to compensate for the capsule's bottom margin
    # inside the Waybar exclusive zone (6 + 4 = 10, matching left/right/bottom).
    gaps_out = 4, 10, 10, 10

    # Change to niri-like side-scrolling layout
    layout = scrolling
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Use round window corners
    rounding = 8

    # Dim unfocused windows (0.0 = no dim, 1.0 = fully dimmed)
    # dim_inactive = true
    # dim_strength = 0.15
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    # Disable all animations
    # enabled = no
}

# https://wiki.hypr.land/Configuring/Variables/#layout
layout {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}

scrolling {
    column_width = 0.9
    focus_fit_method = 0
    follow_focus = true
}

# Enhanced blur quality for the frosted-glass Waybar capsule effect
decoration {
    blur {
        size = 8
        passes = 3
        brightness = 0.85
        contrast = 0.90
        noise = 0.01
    }
}

# Compositor blur is NOT applied to Waybar: Hyprland 0.55 has no ignorezero
# layerrule, so enabling blur would bleed into the transparent gaps between
# capsules. Frosted glass depth is achieved via CSS box-shadow instead.
